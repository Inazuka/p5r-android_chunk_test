
name: Build P5R Android APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit hash or branch to build"
        required: true
        default: "f22b073a531acb112830d197e1a53f09c9839504"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: P5R-Android-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
